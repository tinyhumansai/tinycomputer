[workspace]
resolver = "3"
# Every crate in this repository lives under `crates/`, one directory per
# package, each directory named for the package it holds. There is no root
# package: the crate a host loads is `crates/tinycomputer`, the same as any other
# member. Keeping the root virtual is what makes that uniform — a root package
# would make one crate structurally different from the rest for no reason other
# than history, and it is the arrangement this template moved away from.
members = ["crates/*"]
# `vendor/` holds the pinned TinyBus submodule, which is its own workspace with
# its own lockfile. `worktrees/` holds `git worktree` checkouts of this same
# repository; each contains a full copy of this manifest and every crate under
# it, so without this entry cargo walks into them and reports duplicate
# packages.
exclude = ["vendor", "worktrees"]

# Shared package metadata. A member inherits a field with `field.workspace =
# true`, so the version the release workflow bumps is written in exactly one
# place and every crate moves together.
[workspace.package]
version = "0.10.1"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinycomputer"

[workspace.dependencies]
# The wire contract. `crates/tinycomputer` depends on it and re-exports it, so a
# host that only makes calls takes this crate alone.
# No `version` requirement on purpose: the workspace version moves on every
# release, and a pinned requirement here would stop resolving the moment it did.
# Nothing in this workspace is published, so the path is the whole address.
tinycomputer-bus = { path = "crates/tinycomputer-bus" }
# Shared, engine-free domain logic: keys, safety, records, and facts. Taken by
# the surface adapters and the engine.
tinycomputer-core = { path = "crates/tinycomputer-core" }
# The agent-desktop adapter: `Desktop`, one method per desktop member. Taken by
# the engine and re-exported by the module crate.
tinycomputer-desktop = { path = "crates/tinycomputer-desktop" }
# The agent-browser adapter: typed browser sessions over the linked engine.
tinycomputer-browser = { path = "crates/tinycomputer-browser" }
# The agent runtime: Jev loops, goals, and intent flows. Served by the module.
tinycomputer-engine = { path = "crates/tinycomputer-engine" }
# The agent's on-screen cursor: aim points and human glide paths a surface
# draws over its content. Cosmetic; it sends no input.
tinycomputer-cursor = { path = "crates/tinycomputer-cursor" }
# In-process desktop accessibility middleware for hosts: focused-text queries,
# permission detection, the Globe key listener. A plain library with no bus, so
# a host links it directly instead of calling the module.
tinycomputer-accessibility = { path = "crates/tinycomputer-accessibility" }
# Native typed Jev transport used by the desktop-control policy: the decisions
# crate of the vendored `vendor/tinyinference` submodule, pinned by its gitlink
# so provider validation and retry behavior are reproducible. Only this crate
# of TinyInference is linked into the module.
tinyinference-decisions = { path = "vendor/tinyinference/crates/tinyinference-decisions" }
# The optional LLM planner's model client (engine `planner` feature) and the
# lab's author.
tinyinference-llm = { path = "vendor/tinyinference/crates/tinyinference-llm" }
# The browser automation engine, linked as a library: `execute_command` over a
# `DaemonState`. Vendored from the tinyhumansai fork until
# vercel-labs/agent-browser#2008 lands upstream.
agent-browser = { path = "vendor/agent-browser/cli" }
# The desktop automation engine this module wraps: accessibility-tree
# observation, ref allocation, and the command implementations behind every
# member of the bus interface. Vendored as the `vendor/agent-desktop` submodule
# and pinned by its gitlink, the same way TinyBus is. `core` is
# platform-neutral; the three adapter crates below supply the per-platform
# accessibility backend and are taken as target-specific dependencies.
agent-desktop-core = { path = "vendor/agent-desktop/crates/core" }
agent-desktop-macos = { path = "vendor/agent-desktop/crates/macos" }
agent-desktop-windows = { path = "vendor/agent-desktop/crates/windows" }
agent-desktop-linux = { path = "vendor/agent-desktop/crates/linux" }
# TinyBus defines the message types, interface macro, and frozen module ABI
# used by the generated integration. Socket and CLI features are unnecessary
# here.
tinybus = { path = "vendor/tinybus/crates/tinybus", version = "0.1.2", default-features = false, features = [
    "macros",
    "modules",
] }
# The module-side SDK owns the isolated runtime and exports the ABI entrypoints
# required by TinyBus's dynamic loader.
tinybus-module = { path = "vendor/tinybus/crates/tinybus-module", version = "0.1.2" }
# Derive macros for the crate-wide error types, e.g.
# `crates/tinycomputer-desktop/src/error/`.
# Every dependency entry should carry a comment like this one saying why it is
# here.
thiserror = "2"
# The bus payload types are serialized into TinyBus frames.
serde = { version = "1", features = ["derive"] }
# Positional argument arrays and the module configuration blob.
serde_json = "1"
# Debug and warning logs from `tinycomputer-accessibility`: the facade only, the
# host installs the logger.
log = "0.4"
# `tinycomputer-accessibility`'s `microphone-probe` feature asks the default
# input device whether the app may record. Same major as the host's capture stack.
cpal = "0.18"
# Unpredictable one-use handles bind host confirmation to a module-held action.
getrandom = "0.4"
# Held browser outputs travel as base64 chunks with a SHA-256 digest. Same
# versions agent-browser takes, so the lockfile holds one copy of each.
base64 = "0.22"
sha2 = "0.10"
# A browser session reads a page's address by the WHATWG URL rules Chrome
# reads it by, so an address written another way is judged as the page it
# opens. The version agent-browser takes, so the lockfile holds one copy.
url = "2"
# Module integration tests exercise the real asynchronous in-memory TinyBus.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

# Lints apply to every member that opts in with `[lints] workspace = true`, and
# to every target of that member. CI runs clippy with `-D warnings`, so anything
# set to "warn" here fails the build in CI.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# The cursor sprite is rasterized with supersampling when the overlay helper
# (`tinycomputer-cursor`'s binary) starts; unoptimized, that takes over a second and the first glide is missed.
[profile.dev.package.tinycomputer-cursor]
opt-level = 3
