[package]
name = "tinycomputer-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The tinycomputer agent runtime: Jev decision loops and embeddable browser task flows, with optional desktop support."
documentation = "https://docs.rs/tinycomputer-engine"
readme = "README.md"
keywords = ["automation", "agent", "accessibility", "desktop"]
categories = ["os"]
publish = false

[dependencies]
# Request and result payloads for goals, intents, and flows.
tinycomputer-bus = { workspace = true }
# The surface trait, screen model, and text delivery the loops run over.
tinycomputer-core = { workspace = true }
# The browser surface used by in-process browser task hosts.
tinycomputer-browser = { workspace = true }
# The desktop surface, enabled by the default `desktop` feature.
tinycomputer-desktop = { workspace = true, optional = true }
# The Jev decisions client every loop asks.
tinyinference-decisions = { workspace = true }
# Snapshots, replies, and Jev state are JSON values throughout.
serde_json = { workspace = true }
serde = { workspace = true }
# Unpredictable one-use handles bind host confirmation to a module-held action.
getrandom = { workspace = true }
# Blocking engine calls run on `spawn_blocking`; loops sleep between looks.
tokio = { workspace = true }
url = { workspace = true }

# The planner's OpenRouter model, only with the `planner` feature. The shipped
# module links it, but it stays inert until private configuration supplies a
# key.
tinyinference-llm = { workspace = true, optional = true }

[features]
default = ["desktop"]
# Desktop observation and action entry points.
desktop = ["dep:tinycomputer-desktop"]
# An LLM planner that turns plain-language tasks into flows.
planner = ["dep:tinyinference-llm"]

[dev-dependencies]
# `test-util` for paused time: task tests step past the controller's
# capture and await timeouts without waiting for them in real time.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
