[package]
name = "tinycomputer-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser automation over the agent-browser engine: typed sessions, snapshots, actions, and output handles, with no bus and no agent loop."
documentation = "https://docs.rs/tinycomputer-browser"
readme = "README.md"
keywords = ["browser", "automation", "cdp", "accessibility"]
categories = ["web-programming"]
publish = false

[dependencies]
# The browser interface's payload types, re-exported so
# `tinycomputer_browser::Action` is the contract type.
tinycomputer-bus = { workspace = true }
# Derive macros for the crate-wide error type in `src/error/`.
thiserror = { workspace = true }
# Commands and replies cross into the engine as JSON.
serde_json = { workspace = true }
# Unguessable held-output identities.
getrandom = { workspace = true }
# Held outputs are handed out as base64 chunks and fingerprinted by SHA-256.
base64 = { workspace = true }
sha2 = { workspace = true }
# The surface trait and screen model `BrowserSurface` implements, and the
# platform keymap.
tinycomputer-core = { workspace = true }
# The agent's cursor: where it aims and the human path it glides along,
# drawn in the page before each action. Cosmetic; it sends no input.
tinycomputer-cursor = { workspace = true }
# Addresses checked against a session's allowed origins are read by the
# WHATWG URL rules a browser reads them by (`origins/`).
url = { workspace = true }
# Per-session locks held across engine calls; `rt` for the runtime handle a
# blocking surface call runs the async browser on.
tokio = { workspace = true, features = ["sync", "rt"] }

# The linked engine, with the `agent-browser` feature. Without it the crate
# is the adapter alone, for hosts that bring their own `Launcher`.
agent-browser = { workspace = true, optional = true }

[features]
default = []
# Link agent-browser in-process and provide `AgentBrowser`, its `Launcher`.
agent-browser = ["dep:agent-browser"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
