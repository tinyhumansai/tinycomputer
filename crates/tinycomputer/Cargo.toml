[package]
name = "tinycomputer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native desktop automation — accessibility-tree observation and interaction — as an installable TinyBus module."
documentation = "https://docs.rs/tinycomputer"
readme = "../../README.md"
keywords = ["tinybus", "module", "accessibility", "automation", "desktop"]
categories = ["development-tools", "os"]
publish = false

[lib]
# Keep the ordinary Rust library for tests and downstream reuse while also
# producing the native module artifact that TinyBus loads at runtime.
crate-type = ["rlib", "cdylib"]

[dependencies]
# Native accessibility executes only in this compiled module.
tinycomputer-accessibility = { workspace = true, features = ["paste", "microphone-probe"] }
# Opaque listener lease identifiers require OS entropy.
getrandom = "0.4"
# The wire contract: member names, request payloads, the response envelope, and
# the contract version. Re-exported wholesale from `src/lib.rs` so a consumer
# takes one dependency rather than two, and so `tinycomputer::SnapshotRequest`
# and `tinycomputer_bus::SnapshotRequest` are the same type.
tinycomputer-bus = { workspace = true }
# The agent-desktop adapter. `Desktop`, `Error`, and `Result` are re-exported.
tinycomputer-desktop = { workspace = true }
# The agent runtime behind the agentic and task members: Jev loops, goals,
# flows, the workspace, and the task controller.
# `planner` compiles the LLM planner in; it stays inert until the private
# `planner` configuration supplies a key.
tinycomputer-engine = { workspace = true, features = ["planner"] }
# The browser surface a task's workspace drives, with agent-browser linked
# in-process.
tinycomputer-browser = { workspace = true, features = ["agent-browser"] }
tinybus = { workspace = true }
tinybus-module = { workspace = true }
# Command replies are `serde_json::Value` the whole way through.
serde_json = { workspace = true }
serde = { workspace = true }
# `spawn_blocking`, so a tree walk that takes a second does not stall the
# connection's dispatch task for every other caller. See `src/tinybus_module/`.
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# The GitHub release verifier passes an explicit empty module configuration.
serde_json = { workspace = true }

[features]
default = []

[lints]
workspace = true
